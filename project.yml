name: LEDWallTool
options:
  bundleIdPrefix: org.samanderson
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Automatic

packages:
  WallKit:
    path: Packages/WallKit

targets:
  LEDWallTool:
    type: application
    platform: macOS
    sources:
      - path: LEDWallTool
    dependencies:
      - package: WallKit
    info:
      path: LEDWallTool/Resources/Info.plist
      properties:
        CFBundleDisplayName: LED Wall Tool
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.productivity
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: org.samanderson.ledwalltool.project
            UTTypeDescription: LED Wall Tool Project
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [ledwall]
    entitlements:
      path: LEDWallTool/Resources/LEDWallTool.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.samanderson.LEDWallTool
        PRODUCT_NAME: LEDWallTool
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
